services:
  - type: web
    name: whatsapp-automation
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: DEFAULT_COUNTRY_CODE
        value: 91
      - key: MIN_DELAY_SECONDS
        value: 15
      - key: MAX_DELAY_SECONDS
        value: 30
